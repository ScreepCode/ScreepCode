name: Metrics

on:
  # Schedule daily updates at 05:00 UTC
  schedule:
    - cron: "0 5 * * *"
  # Run on push to main when script or workflow changes
  push:
    branches:
      - main
    paths:
      - "scripts/**"
      - ".github/workflows/metrics.yml"
  # Allow manual runs anytime
  workflow_dispatch:

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    name: Generate GitHub Profile Metrics & Blog
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Generate SVG metrics & update README
        env:
          METRICS_TOKEN: ${{ secrets.METRICS_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TIMEZONE: Europe/Berlin
          RSS_URL: https://www.niklas-buse.de/rss.xml
        run: node scripts/generate-metrics.mjs

      - name: Commit and push updated metrics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add metrics/*.svg README.md
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: update profile metrics and blog posts [skip ci]"
            git push
          fi
