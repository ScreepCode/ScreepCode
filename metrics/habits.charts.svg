<svg xmlns="http://www.w3.org/2000/svg" width="480" height="290" viewBox="0 0 480 290" class="">
    <defs><style/></defs>
    <style>
  svg {
    font-family: -apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif, Apple Color Emoji, Segoe UI Emoji;
    font-size: 14px;
    color: #8b949e;
  }
  h1, h2, h3 {
    margin: 8px 0 2px;
    padding: 0;
    color: #2f81f7;
    font-weight: 400;
  }
  h1 {
    font-size: 20px;
    font-weight: 700;
  }
  h2 {
    font-size: 16px;
  }
  h3 {
    font-size: 14px;
  }
  h1 svg, h2 svg, h3 svg {
    fill: currentColor;
  }
  section > .field {
    margin-left: 5px;
    margin-right: 5px;
  }
  .field {
    display: flex;
    align-items: center;
    margin-bottom: 2px;
    white-space: nowrap;
  }
  .field.wrap, .row {
    flex-wrap: wrap;
  }
  .field svg {
    margin: 0 8px;
    fill: #8b949e;
    flex-shrink: 0;
  }
  .row {
    display: flex;
  }
  .row section {
    flex: 1 1 0;
  }
  .column {
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .fill-width, #metrics-end {
    width: 100%;
  }
  .avatar {
    border-radius: 50%;
    margin: 0 6px;
  }
  .calendar.field {
    margin: 4px 0 4px 7px;
  }
  .calendar .day {
    outline: 1px solid rgba(27, 31, 35, 0.04);
    outline-offset: -1px;
  }
  svg.bar {
    margin: 4px 0;
  }
  .field.language {
    margin: 0 8px;
    flex-grow: 0;
  }
  .field.language.details, .field.language.details small {
    display: flex;
    justify-content: space-between;
  }
  .field.language.details small {
    color: #8b949e;
    text-align: right;
  }
  .field.language.details > *, .field.language.details small > * {
    flex: 1 1 0;
  }
  .field.language.details small > :not(:last-child) {
    margin-right: 6px;
  }
  .h-details {
    margin: 0 4px;
    padding-top: 4px;
    font-size: 0.8rem;
    color: #8b949e;
  }
  .chart {
    padding: 0 8px;
  }
  .chart-bars {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    width: 100%;
    margin: 8px 0 4px;
    flex-grow: 1;
    min-height: 72px;
  }
  .chart-bars .entry {
    flex-grow: 1;
    font-size: 10px;
    color: #8b949e;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .chart-bars .entry .value {
    font-size: 8px;
    margin-bottom: 2px;
    min-height: 10px;
  }
  .chart-bars .bar {
    width: 7px;
    background-color: var(--color-calendar-graph-day-bg);
    border: 1px solid var(--color-calendar-graph-day-border);
    border-radius: 5px;
  }
  .chart-bars.horizontal {
    flex-direction: column;
    height: 100%;
    justify-content: center;
  }
  .chart-bars.horizontal .entry {
    align-items: center;
    flex-direction: row;
    width: 100%;
    min-height: 1.25rem;
  }
  .chart-bars.horizontal .entry .name {
    flex-shrink: 0;
    text-align: right;
    width: 34%;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .chart-bars.horizontal .bar {
    height: 7px;
    width: auto;
    margin: 0 6px;
  }
  .habits .facts {
    margin: 4px 0 0;
    list-style-type: none;
    padding-left: 18px;
  }
  .habits .facts li {
    margin-bottom: 5px;
    display: flex;
    align-items: center;
  }
  .habits .facts li::before {
    content: "•";
    color: #2f81f7;
    font-weight: bold;
    display: inline-block;
    width: 14px;
  }
  code {
    background-color: rgba(139, 148, 158, 0.15);
    display: inline-block;
    border-radius: 6px;
    padding: 1px 5px;
    margin: 0 3px;
    font-size: 85%;
    color: #8b949e;
    font-family: SFMono-Regular, Consolas, Liberation Mono, Menlo, monospace;
  }
  .rss-item {
    display: flex;
    align-items: flex-start;
    padding: 2px 5px;
    margin: 0;
  }
  .rss-item svg {
    margin: 3px 8px 0 3px;
    fill: #8b949e;
    flex-shrink: 0;
  }
  .rss-item .infos {
    flex: 1;
    min-width: 0;
  }
  .rss-item .title {
    font-weight: 500;
    font-size: 14px;
    color: #2f81f7;
    line-height: 1.3;
  }
  .rss-item .meta {
    font-size: 12px;
    color: #8b949e;
    margin-top: 2px;
    line-height: 1.3;
  }
  :root {
    --color-calendar-graph-day-bg: rgba(139, 148, 158, 0.18);
    --color-calendar-graph-day-border: rgba(139, 148, 158, 0.12);
    --color-calendar-graph-day-L1-bg: #0e4429;
    --color-calendar-graph-day-L2-bg: #006d32;
    --color-calendar-graph-day-L3-bg: #26a641;
    --color-calendar-graph-day-L4-bg: #39d353;
  }
</style>
